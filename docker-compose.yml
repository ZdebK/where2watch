version: '3.8'

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: where2watch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./server
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: where2watch
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SCHEMA: public
      RUN_UPGRADES: "true"
    ports:
      - "3001:3001"
    depends_on:
      - db

  frontend:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
